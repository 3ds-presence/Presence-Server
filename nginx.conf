upstream backend {
    server backend:5555;
}

upstream ffl-testing-web-server {
    server ffl-testing-web-server:5000;
}

# Log format that includes the request body (POST data)
log_format post_detail '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'body="$request_body"';

server {
    listen 80;
    server_name _;

    # Frontend
    root /usr/share/nginx/html;
    index index.html;

    # API
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    location /miis/ {
        proxy_pass http://ffl-testing-web-server/miis/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    # Serve frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}

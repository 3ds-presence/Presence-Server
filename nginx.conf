resolver 127.0.0.11 ipv6=off valid=10s;

# WARNING: If this Nginx instance is exposed directly to the internet without a trusted proxy,
# the X-Real-IP header can easily be spoofed by a malicious client.
# This block uses X-Real-IP whenever present (provided by an upstream proxy or an attacker),
# falling back to $remote_addr only when the header is completely missing.
map $http_x_real_ip $client_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# Log format that includes the request body (POST data)
log_format post_detail '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'body="$request_body"';

server {
    listen 80;
    server_name _;

    # Frontend
    root /usr/share/nginx/html;
    index index.html;

    # API
    location /api/ {
        set $backend_upstream "http://backend:5555";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    location /miis/ {
        set $ffl_upstream "http://ffl-testing-web-server:5000";
        proxy_pass $ffl_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    # Serve frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
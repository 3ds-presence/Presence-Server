resolver 127.0.0.11 ipv6=off valid=10s;

# WARNING: If this Nginx instance is exposed directly to the internet without a trusted proxy,
# the X-Real-IP header can easily be spoofed by a malicious client.
# This block uses X-Real-IP whenever present (provided by an upstream proxy or an attacker),
# falling back to $remote_addr only when the header is completely missing.
map $http_x_real_ip $client_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# Log the request body but mask the aes_key_hex secret (keep first 4 chars).
map $request_body $sanitized_body {
    default $request_body;
    "~^(?<pre>.*aes_key_hex=[0-9a-fA-F]{4})[0-9a-fA-F]{60}(?<post>.*)$" "$pre****$post";
}

log_format post_detail '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'body="$sanitized_body"';

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    # Frontend
    root /usr/share/nginx/html;
    index index.html;

    # API
    location /api/ {
        set $backend_upstream "http://backend:5555";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    # Public Mii rendering endpoint: /miis/<data>
    # Only the Mii data is accepted, from the URL path.
    # It is forwarded to the real renderer as /miis/image.png?data=<data>.
    # All other query parameters (width, scale, texResolution, ...) are dropped
    location ~ "^/miis/(?<mii_data>[A-Fa-f0-9]{192})$" {
        set $ffl_upstream "http://ffl-testing-web-server:5000";
        proxy_pass $ffl_upstream/miis/image.png?data=$mii_data&width=32&scale=1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log POST details (body content) to stdout
        access_log /dev/stdout post_detail;
    }

    # Block direct access to the real renderer endpoints
    # (/miis/image.png, /miis/image.glb, /miis/image.tga, ...).
    # This prevents bypassing the safe endpoint above with heavy parameters.
    location /miis/ {
        return 404;
    }

    # Serve frontend assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
x-logging: &default-logging
  driver: "json-file"

services:
  # Rust backend (presence-server)
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        - DEBUG=false # cargo build --release if false, cargo build if true
    environment:
      # Discord Application credentials (required)
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - MASTER_KEY=${MASTER_KEY}

      # Database (SQLite by default, can be changed to PostgreSQL)
      # For SQLite: sqlite:presence.db?mode=rwc
      # For PostgreSQL: postgres://user:pass@localhost/presence_db
      - DATABASE_URL=sqlite:/app/data/presence.db?mode=rwc

      # Do not change this unless you also change the Nginx config
      - LISTEN_ADDR=0.0.0.0:5555
      
      # Rate limiting
      # Minimum seconds between two activity updates for the same client
      - ACTIVITY_COOLDOWN_SECS=5
      # Maximum number of concurrent sessions per IP
      - MAX_CLIENTS_PER_IP=8
      
      - ASSETS_BASE_URL=${ASSETS_BASE_URL}
      - SCRIPTS_DIR=${SCRIPTS_DIR}
      - MII_GENERATOR_SERVER=${MII_GENERATOR_SERVER}

      - CACHE_CAPACITY=4096
      - CACHE_EVICT_BATCH=512

      - RUST_LOG=${RUST_LOG:-info},sqlx=warn
    volumes:
      - backend-data:/app/data
      - ./backend/activity_generator/scripts:${SCRIPTS_DIR}:ro
    depends_on:
      - nginx
    restart: unless-stopped
    logging: *default-logging

  # Nginx reverse proxy (serves frontend + proxies /api to backend)
  nginx:
    build:
      context: presence-frontend
      dockerfile: Dockerfile
      args:
        # Used on compilation (frontend must be rebuilt if changed)
        - VITE_DISCORD_OAUTH_URL=${DISCORD_OAUTH_URL}
        - VITE_TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-}
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dyn/:/usr/share/nginx/html/dyn/:ro
    restart: unless-stopped
    logging: *default-logging
  
  # Services for Mii Generator Server (used for generating Mii images)
  ffl-testing-renderer:
    build:
      context: mii-generator-server
      dockerfile: Dockerfile.ffl-testing-renderer
    container_name: ffl-testing-renderer
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    cpus: 1
    logging: *default-logging

  ffl-testing-web-server:
    build:
      context: mii-generator-server
      dockerfile: Dockerfile.ffl-testing-web-server
    container_name: ffl-testing-web-server
    depends_on:
      - ffl-testing-renderer
    restart: unless-stopped
    logging: *default-logging

  # Daily log rotation.
  # Copies yesterday's log into ./logs/YYYY-MM-DD/, compresses it to .xz
  # and deletes logs older than LOG_RETENTION_DAYS.
  service-logs:
    build:
      context: deploy/service-logs
      dockerfile: Dockerfile
    container_name: 3ds-presence-service-logs
    restart: unless-stopped
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-3ds-presence}
      - RETENTION_DAYS=${LOG_RETENTION_DAYS:-90}
      - MAX_SIZE_BYTES=${LOG_MAX_SIZE_BYTES:-15728640}
      - WAIT_SECS=60
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/logs

  service-build-firm:
    build:
      context: deploy/build-firm
      dockerfile: Dockerfile
    container_name: 3ds-presence-service-build-firm
    restart: unless-stopped
    volumes:
      - ./deploy/build-firm/info:/app/info
      - ./frontend-dyn:/app/result

volumes:
  backend-data:

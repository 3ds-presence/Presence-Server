services:
  # Rust backend (presence-server)
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        - DEBUG=false # cargo build --release if false, cargo build if true
    environment:
      # Discord Application credentials (required)
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}

      # Database (SQLite by default, can be changed to PostgreSQL)
      # For SQLite: sqlite:presence.db?mode=rwc
      # For PostgreSQL: postgres://user:pass@localhost/presence_db
      - DATABASE_URL=sqlite:/app/data/presence.db?mode=rwc

      # Do not change this unless you also change the Nginx config
      - LISTEN_ADDR=0.0.0.0:5555
      
      # Rate limiting
      # Minimum seconds between two activity updates for the same client
      - ACTIVITY_COOLDOWN_SECS=5
      # Maximum number of concurrent sessions per IP
      - MAX_CLIENTS_PER_IP=8
      
      - ASSETS_BASE_URL=${ASSETS_BASE_URL}
      - SCRIPTS_DIR=${SCRIPTS_DIR}
      - MII_GENERATOR_SERVER=${MII_GENERATOR_SERVER}

      - LUA_POOL_MAX=64

      - RUST_LOG=debug,sqlx=warn
    volumes:
      # Persist SQLite database across restarts
      - ./backend-data:/app/data
      - ./backend/activity_generator/scripts:${SCRIPTS_DIR}:ro
    restart: unless-stopped

  # Nginx reverse proxy (serves frontend + proxies /api to backend)
  nginx:
    build:
      context: presence-frontend
      dockerfile: Dockerfile
      args:
        # Used on compilation (frontend must be rebuilt if changed)
        - VITE_DISCORD_OAUTH_URL=${DISCORD_OAUTH_URL}
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dyn/:/usr/share/nginx/html/dyn/:ro
    depends_on:
      - backend
      - ffl-testing-web-server
    restart: unless-stopped
  
  # Services for Mii Generator Server (used for generating Mii images)
  ffl-testing-renderer:
    build:
      context: mii-generator-server
      dockerfile: Dockerfile.ffl-testing-renderer
    container_name: ffl-testing-renderer
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    cpus: 1

  ffl-testing-web-server:
    build:
      context: mii-generator-server
      dockerfile: Dockerfile.ffl-testing-web-server
    container_name: ffl-testing-web-server
    depends_on:
      - ffl-testing-renderer
    restart: unless-stopped
